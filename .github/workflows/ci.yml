name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - run: python -m compileall -q src
      - run: python -m pytest -q
        env:
          PYTHONPATH: src
      - name: El diff de ejemplo debe producir hallazgos criticos (exit 2)
        env:
          PYTHONPATH: src
        run: |
          set +e
          python -m veredicto review --llm mock --diff testdata/sample.diff --fail-on critical > /dev/null
          test $? -eq 2
