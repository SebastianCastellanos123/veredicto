[project]
name = "veredicto"
version = "1.0.0"
description = "Revisor de pull requests con un orquestador y subagentes especialistas (seguridad, calidad y pruebas)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []          # cero dependencias en tiempo de ejecución: solo la librería estándar

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
veredicto = "veredicto.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
